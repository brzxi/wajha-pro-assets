name: Generate final categories-only GIF
on:
  workflow_dispatch:
  push:
    paths:
      - 'kanon-alawal/categories-only-corrected.svg'
      - '.github/workflows/generate-kanon-categories-gif.yml'
permissions:
  contents: write
jobs:
  build-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pillow playwright
      - name: Render animated transparent GIF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import asyncio
          from PIL import Image

          svg = Path('kanon-alawal/categories-only-corrected.svg').read_text(encoding='utf-8')
          html = f"""<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
          html,body {{ margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }}
          svg {{width:1280px;height:253px;display:block;}}
          </style></head><body>{svg}</body></html>"""
          directory = Path('/tmp/kanon-gif-frames')
          directory.mkdir(parents=True, exist_ok=True)
          
          async def make_frames():
              from playwright.async_api import async_playwright
              async with async_playwright() as p:
                  browser = await p.chromium.launch(executable_path='/usr/bin/google-chrome', headless=True, args=['--no-sandbox'])
                  page = await browser.new_page(viewport={'width':1280,'height':253}, device_scale_factor=1)
                  await page.set_content(html, wait_until='load')
                  await page.wait_for_timeout(400)
                  for i in range(24):
                      if i > 0:
                          await page.wait_for_timeout(250)
                      await page.screenshot(path=str(directory/f'{i:03d}.png'), omit_background=True)
                  await browser.close()

          asyncio.run(make_frames())
          frames = []
          for path in sorted(directory.glob('*.png')):
              rgba = Image.open(path).convert('RGBA')
              matte = Image.new('RGB', rgba.size, (255,0,255))
              matte.paste(rgba.convert('RGB'), mask=rgba.getchannel('A'))
              pal = matte.quantize(colors=255, method=Image.Quantize.MEDIANCUT)
              mask = rgba.getchannel('A').point(lambda x: 255 if x < 90 else 0)
              pal.paste(255, mask=mask)
              pal.info['transparency'] = 255
              frames.append(pal)
          output = Path('kanon-alawal/categories-only-corrected.gif')
          frames[0].save(output, save_all=True, append_images=frames[1:],
                         loop=0, duration=250, disposal=2, transparency=255,
                         optimize=False)
          out = Image.open(output)
          assert out.n_frames == 24, out.n_frames
          assert out.convert('RGBA').getpixel((800,0))[3] == 0
          print('GIF saved:', output, 'bytes:', output.stat().st_size, 'frames:', out.n_frames)
          PY
      - name: Publish generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanon-alawal/categories-only-corrected.gif
          if ! git diff --cached --quiet; then
            git commit -m "Publish final categories-only GIF"
            git push
          fi
