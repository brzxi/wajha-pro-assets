<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="380" viewBox="0 0 1920 380" role="img" aria-label="بانر التصنيفات المتحرك - كانون الأول">
<title>التصنيفات | كانون الأول</title>
<desc>بانر متحرك بألوان كانون الأول مع رسم السديرية والشال ولمعان هادئ وعنوان التصنيفات</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b7456"/><stop offset=".24" stop-color="#e7d5bf"/><stop offset=".51" stop-color="#f8f3eb"/><stop offset=".76" stop-color="#e5d0b7"/><stop offset="1" stop-color="#917055"/></linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8eee0" stop-opacity=".85"/><stop offset="1" stop-color="#f0dac0" stop-opacity=".1"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fce6bd"/><stop offset=".48" stop-color="#af855f"/><stop offset="1" stop-color="#f7deaf"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9f1" stop-opacity=".95"/><stop offset=".55" stop-color="#f8eee2" stop-opacity=".89"/><stop offset="1" stop-color="#ead7c0" stop-opacity=".9"/></linearGradient>
<linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#342b27"/><stop offset=".53" stop-color="#4c3d34"/><stop offset="1" stop-color="#231c1a"/></linearGradient>
<linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4b08b"/><stop offset=".48" stop-color="#f0dfc9"/><stop offset="1" stop-color="#a87656"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff5d7" stop-opacity=".6"/><stop offset="1" stop-color="#fff1d9" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="outer"><rect x="3" y="3" width="1914" height="374" rx="36"/></clipPath>
<clipPath id="middle"><rect x="531" y="64" width="858" height="252" rx="80"/></clipPath>
</defs>
<style>
@keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes down{0%,100%{transform:translateY(-8px)}50%{transform:translateY(6px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes shine{0%{transform:translateX(-1100px)}55%,100%{transform:translateX(1800px)}}
@keyframes textup{0%{opacity:.82;transform:translateY(4px)}45%{opacity:1;transform:translateY(-2px)}100%{opacity:.82;transform:translateY(4px)}}
@keyframes circle{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes twinkle{0%,75%,100%{opacity:.25;transform:scale(.8)}82%{opacity:1;transform:scale(1.2)}}
.left{animation:up 6s ease-in-out infinite}
.right{animation:down 6.5s ease-in-out infinite}
.heading{animation:textup 5.5s ease-in-out infinite}
.glisten{animation:shine 7.2s ease-in-out infinite}
.starA{animation:twinkle 5.5s ease-in-out infinite;transform-origin:470px 112px}
.starB{animation:twinkle 4.8s 1.2s ease-in-out infinite;transform-origin:1448px 265px}
.starC{animation:twinkle 6.2s 2.4s ease-in-out infinite;transform-origin:128px 276px}
.lum{animation:pulse 5s ease-in-out infinite}
</style>
